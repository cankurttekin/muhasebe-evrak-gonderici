services:
  zirve-whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zirve_whatsapp_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - ZIRVE_DATA_PATH=/zirvedata
      - DATA_DIR=/app/data
      - WA_SIMULATION=false
    volumes:
      # ÖNEMLİ: Zirve verileri sunucudan KESİNLİKLE SALT OKUNUR (:ro) olarak bağlanır.
      # Uygulama hiçbir koşulda zirvedata klasöründe dosya silemez veya değiştiremez.
      - ${ZIRVE_HOST_PATH:-/zirvedata}:/zirvedata:ro
      # Uygulama veritabanı (gönderim kayıtları, telefon düzenlemeleri) ve WhatsApp QR oturumu
      - ./data:/app/data
